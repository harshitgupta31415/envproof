name: Validate environment contract

on:
  pull_request:
    paths:
      - ".env.example"
      - ".env.ci"
      - ".github/workflows/environment.yml"

permissions:
  contents: read

jobs:
  envproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install envproof
        run: python -m pip install git+https://github.com/harshitgupta31415/envproof.git
      - name: Validate documented CI configuration
        run: envproof --template .env.example --env .env.ci --strict
